name: mamu_learn
description: Учебная платформа для репетиторов
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # Network
  dio: ^5.4.3+1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # UI
  lucide_icons_flutter: ^3.1.23 # иконки интерфейса (ISC), см. brand/BRAND_GUIDELINES.md

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4

  # Иконки приложения из brand/app-icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "../brand/app-icon/app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "../brand/app-icon/app-icon-foreground.png"
  adaptive_icon_monochrome: "../brand/app-icon/app-icon-foreground.png"
  adaptive_icon_foreground_inset: 0 # отступы уже заложены в app-icon-foreground
  web:
    generate: true
    image_path: "../brand/app-icon/app-icon.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Golos Text (OFL, assets/fonts/OFL.txt) — шрифт бренда, см. brand/BRAND_GUIDELINES.md
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-400.ttf
          weight: 400
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-600.ttf
          weight: 600
        - asset: assets/fonts/GolosText-700.ttf
          weight: 700
