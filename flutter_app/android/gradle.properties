# Лимиты памяти подобраны под ноутбук с 16 ГБ, где параллельно работают
# Docker, эмулятор и VS Code. Шаблон Flutter (-Xmx8G + 4G metaspace) занимал
# до 12 ГБ и вешал систему. 3 ГБ хватает для сборки этого проекта.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
# Меньше параллельных воркеров — меньше пиковая память (у машины 16 потоков).
org.gradle.workers.max=4
android.useAndroidX=true
