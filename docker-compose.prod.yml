version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repetapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repetapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repetapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repetapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repetapp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio and quay.io/minio/minio were pulled from public Docker Hub/Quay in
  # Sept 2026 — MinIO's free community images are no longer anonymously pullable.
  # SeaweedFS (Apache 2.0, still on Docker Hub) serves the same S3 API as a drop-in
  # replacement; MINIO_ROOT_USER/PASSWORD are reused as its S3 credentials.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: repetapp-seaweedfs
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"repetapp\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" > /tmp/s3.json &&
      weed server -dir=/data -master -volume -filer -s3 -s3.port=9000 -s3.config=/tmp/s3.json -ip=seaweedfs
      "
    volumes:
      - minio_data:/data

  minio-init:
    image: amazon/aws-cli:latest
    container_name: repetapp-minio-init
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://seaweedfs:9000 s3api head-bucket --bucket ${S3_BUCKET:-repetapp-files} && exit 0;
        aws --endpoint-url http://seaweedfs:9000 s3 mb s3://${S3_BUCKET:-repetapp-files} && exit 0;
        sleep 2;
      done;
      exit 1;
      "
    # Bucket is private — files are accessible via signed URLs only (1h TTL).

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repetapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: production
      SERVER_VERSION: ${SERVER_VERSION:-1.0.0}
      SERVER_ALLOWED_ORIGINS: ${SERVER_ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-repetapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repetapp}?sslmode=disable
      DATABASE_MAX_CONNS: "25"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
      S3_ENDPOINT: seaweedfs:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-repetapp-files}
      S3_USE_SSL: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_ESKIZ_EMAIL: ${SMS_ESKIZ_EMAIL:-}
      SMS_ESKIZ_PASSWORD: ${SMS_ESKIZ_PASSWORD:-}
      SMS_ESKIZ_FROM: ${SMS_ESKIZ_FROM:-4546}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-0.0.0}
      APP_FEATURES: ${APP_FEATURES:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      AUTO_MIGRATE: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: repetapp-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - ./flutter_app/build/web:/srv/web:ro
      - ./downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
