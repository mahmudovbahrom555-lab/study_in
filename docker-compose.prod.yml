version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repetapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repetapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repetapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repetapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repetapp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: repetapp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: repetapp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET:-repetapp-files};
      exit 0;
      "
    # Bucket is private — files are accessible via signed URLs only (1h TTL).

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repetapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      SERVER_ENV: production
      SERVER_VERSION: ${SERVER_VERSION:-1.0.0}
      SERVER_ALLOWED_ORIGINS: ${SERVER_ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-repetapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repetapp}?sslmode=disable
      DATABASE_MAX_CONNS: "25"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-repetapp-files}
      S3_USE_SSL: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_ESKIZ_EMAIL: ${SMS_ESKIZ_EMAIL:-}
      SMS_ESKIZ_PASSWORD: ${SMS_ESKIZ_PASSWORD:-}
      SMS_ESKIZ_FROM: ${SMS_ESKIZ_FROM:-4546}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      AUTO_MIGRATE: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
