name: Play Release (AAB, manual)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (must include /api/v1)'
        required: true
        default: 'https://api.mamu.education/api/v1'
      google_client_id:
        description: 'Google OAuth Web client ID (public)'
        required: true
        default: '861962304134-2meell0ovqjnlj48cu8ukqnuf260if0g.apps.googleusercontent.com'

jobs:
  aab:
    name: Signed AAB for Google Play
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      # Ключ загрузки — только из секретов; оригинал у владельцев (вне Git).
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # versionCode = номер запуска: растёт сам, Play требует новый на каждую загрузку.
      - name: Build AAB
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=API_URL=${{ inputs.api_url }}
          --dart-define=ENV=production
          --dart-define=GOOGLE_CLIENT_ID=${{ inputs.google_client_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

      - name: Remove key files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
