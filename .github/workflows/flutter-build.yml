name: Flutter Build (manual)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (must include /api/v1)'
        required: true
        default: 'https://api.mamu.education/api/v1'
      google_client_id:
        description: 'Google OAuth Web client ID (empty = no Google button)'
        required: false
        default: ''

jobs:
  build:
    name: Build web + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build web
        run: flutter build web --dart-define=API_URL=${{ inputs.api_url }} --dart-define=ENV=production --dart-define=GOOGLE_CLIENT_ID=${{ inputs.google_client_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web

      - name: Build APK (debug, for phone testing — release needs a Play signing key, see android/key.properties)
        run: flutter build apk --debug --dart-define=API_URL=${{ inputs.api_url }} --dart-define=ENV=production --dart-define=GOOGLE_CLIENT_ID=${{ inputs.google_client_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
