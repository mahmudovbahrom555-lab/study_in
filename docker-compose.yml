services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repetapp-postgres
    environment:
      POSTGRES_USER: repetapp
      POSTGRES_PASSWORD: repetapp_dev_password
      POSTGRES_DB: repetapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repetapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repetapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: repetapp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Создаёт bucket автоматически при старте
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: repetapp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Bucket остаётся приватным — файлы доступны только через signed URLs (TTL 1 час).
    # Анонимный доступ намеренно не включается. См. DECISIONS.md.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin_dev
        mc mb --ignore-existing local/repetapp-files
        exit 0

  # Go-бэкенд в Docker (не нужен локальный Go): docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build: ./backend
    container_name: repetapp-api
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgres://repetapp:repetapp_dev_password@postgres:5432/repetapp?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      AUTO_MIGRATE: "true"
      # Фиксированный код входа для любого номера (только dev + SMS_PROVIDER=mock)
      SMS_DEV_CODE: "111111"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
